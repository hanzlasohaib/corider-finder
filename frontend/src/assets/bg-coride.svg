<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Co-ride background">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2E7D32" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#1B5E20" stop-opacity="0.15"/>
    </linearGradient>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#1B5E20" stroke-opacity="0.12" stroke-width="2"/>
      <circle cx="12" cy="12" r="2.2" fill="#1B5E20" fill-opacity="0.14"/>
      <circle cx="68" cy="44" r="2.2" fill="#1B5E20" fill-opacity="0.10"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.8"/>
    </filter>
  </defs>

  <!-- soft grid / map texture -->
  <rect width="1600" height="900" fill="url(#grid)"/>

  <!-- broad "route" curves -->
  <g fill="none" stroke="url(#g)" stroke-linecap="round" filter="url(#soft)">
    <path d="M-80 720 C 220 560, 420 820, 720 660 S 1180 420, 1700 520" stroke-width="16" stroke-opacity="0.40"/>
    <path d="M-120 260 C 240 60, 520 340, 820 200 S 1260 120, 1700 260" stroke-width="10" stroke-opacity="0.32"/>
    <path d="M200 980 C 420 740, 640 860, 900 740 S 1280 520, 1500 650" stroke-width="8" stroke-opacity="0.26"/>
  </g>

  <!-- pins -->
  <g fill="none" stroke="#1B5E20" stroke-opacity="0.22" stroke-width="8" filter="url(#soft)">
    <path d="M370 250c0-55 45-100 100-100s100 45 100 100c0 80-100 190-100 190S370 330 370 250Z"/>
    <circle cx="470" cy="250" r="34" fill="#1B5E20" fill-opacity="0.14" stroke="none"/>

    <path d="M1120 610c0-47 38-85 85-85s85 38 85 85c0 70-85 165-85 165s-85-95-85-165Z"/>
    <circle cx="1205" cy="610" r="28" fill="#1B5E20" fill-opacity="0.12" stroke="none"/>
  </g>

  <!-- tiny car glyph -->
  <g transform="translate(820 420) scale(1.05)" fill="none" stroke="#1B5E20" stroke-opacity="0.22" stroke-width="10" stroke-linejoin="round" stroke-linecap="round" filter="url(#soft)">
    <path d="M-150 40h300l30 70v70H-180v-70l30-70Z"/>
    <path d="M-90 40l25-55h130l25 55"/>
    <circle cx="-95" cy="180" r="30" fill="#1B5E20" fill-opacity="0.10" stroke="none"/>
    <circle cx="95" cy="180" r="30" fill="#1B5E20" fill-opacity="0.10" stroke="none"/>
    <path d="M-120 115h240"/>
  </g>
</svg>
